# ReefFlow project file - demo: standard 75-gallon reef tank.
# Quantities are "<number> <unit>" strings (in, ft, mm, m, GPH, L/h, s, ...).
# Coordinates: origin at the inside bottom-left-front glass corner; x along the
# length (left -> right seen from the front), y front -> back, z up.
reefflow_project: 1
name: Demo 75-gallon reef
display_units: US

tank:
  external: {length: 48 in, width: 18 in, height: 21 in}
  glass_thickness: 1/2 in            # sides and bottom (DECISIONS D-007)
  water_level_below_rim: 1 in
  sand_depth: 2 in

rockscape:
  - file: rock.stl                   # two islands, generated by `reefflow demo`
    unit: mm
    translate: [0 mm, 0 mm, 0 mm]

overflow:
  corner: back-right
  width: 6 in                        # along x
  depth: 6 in                        # along y
  crest_below_surface: 1/2 in

pumps:
  - name: return
    archetype: return_nozzle         # 3/4 in nozzle; flow from the pump curve
    rated_flow: 800 GPH
    static_head: 4 ft
    fittings_allowance: 1 ft
    position: [40.2 in, 10.6 in, 17.3 in]
    aim: [-1, -0.6, -0.25]

  - name: PH-left
    archetype: narrow_jet_propeller
    rated_flow: 1500 GPH
    derating: 0.7                    # delivered / rated (ASSUMPTIONS A-205)
    position: [2.8 in, 11.8 in, 15.0 in]
    aim: [1, -0.25, -0.1]
    mode: {type: constant}

  - name: PH-right
    archetype: wide_jet_propeller
    rated_flow: 2600 GPH
    derating: 0.7
    position: [44.3 in, 4.7 in, 14.2 in]
    aim: [-1, 0.25, -0.1]
    mode: {type: constant}

lighting:
  fixtures:                          # two generic ~90 W LED pucks, 90 deg optics
    - name: LED-left
      archetype: led_puck
      position: [11.75 in, 8.5 in]   # quarter points of the 47 in internal length, mid-width
      height: 8 in                   # emitting face above the water surface (spec demo)
      channels: {white: 80}          # % per channel; the others stay at 100 %
    - name: LED-right
      archetype: led_puck
      position: [35.25 in, 8.5 in]
      height: 8 in
      channels: {white: 80}
  photoperiod: {"on": "10:00", "off": "20:00", ramp: 60 min, peak: 100}   # 9 h full-intensity equivalent
  water: {kd: 0.08 1/m, n: 1.34}     # clear reef water (approximation, PLAN C8)
  surface: {roughness: 0.0}          # flat surface (spec default)
  glass:
    n: 1.5
    walls: {front: clear, back: black, left: clear, right: clear}
  albedo: {sand: 0.6, rock: 0.15}    # aragonite sand / coralline-covered live rock (starting values)
  bounces: true
  rock_geometry: auto                # STL when available (it is: rock.stl)
  rays: 2.0e7                        # minimum photons ...
  target_noise: 0.02                 # ... then trace until an average-lit 5 mm patch has 2 % noise
  map_spacing: 75 mm                 # plan maps every 75 mm (~3 in) below the surface
  map_resolution: 5 mm

simulation:
  lattice: D3Q19                     # D-120
  collision: rr
  smagorinsky: 0.10                  # D-118
  preset: standard                   # preview 10 mm | standard 5 mm | fine 3 mm
  spinup: 60 s
  average: 120 s
  seed: 1

criteria:                            # all thresholds are starting assumptions (ASSUMPTIONS.md)
  dead_zone_speed: 2.5 cm/s          # time-averaged speed below this = dead water
  detritus_shear_Pa: 0.02            # sand/rock-top shear below this: detritus settles
  sand_move_shear_Pa: 0.5            # sand shear above this: sand is moved
  # coral_profiles:                  # override or add profiles (see reefflow/data/coral_profiles.yaml)
  #   SPS: {speed_ideal: [0.12, 0.30]}
