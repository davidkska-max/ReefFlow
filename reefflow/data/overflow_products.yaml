# ReefFlow overflow catalogue (D-844) and drain capacities (D-846).
#
# Picking a product sets the overflow box size (width along the glass, depth out from the
# glass) and its rated capacity. The capacity is only used to WARN when the return flow is
# higher; the flow model does not limit the overflow. Values are as published by the
# maker (or a retailer copying the maker's table, as noted) and were checked 2026-11-12.
# The weir crest depth is not published for any of these; keep your measured value.
#
# drain_capacity: commonly quoted single-drain capacities by pipe size. The sources
# disagree by up to 2x (measured test vs rules of thumb); the measured test is the
# conservative one. BeanAnimal's write-up gives no per-pipe table (one tank: 3 x 1 in
# bulkheads, 2000 GPH silent).
products:
  synergy_reef_shadow_16_v3:
    brand: Synergy Reef
    model: 16" Shadow Overflow V3
    mount: internal
    box:
      width: 16 in
      depth: 1.6 in
      height: 5.5 in
    rated_flow: 2500 GPH
    rated_flow_basis: 'published as ''400-2500 GPH''. Mfr: ''2,500 GPH Silent BeanAnimal Performance'' with three
      1.5 in rear bulkheads plumbed full-siphon + open-channel + emergency. 400 GPH is the stated lower end. Mfr
      also says suits tanks 10-400 gal.'
    design: BeanAnimal (full siphon + open channel + emergency)
    drains: 3 x 1.5 in rear bulkheads (molded in; 1.5 in PVC pipe kits). Tank holes drilled with 63 mm diamond hole
      saw (mfr accessory 'correct size' for V3).
    status: current
    checked: '2026-11-12'
    sources:
    - https://synergyreef.com/collections/shadow-overflow (Shopify product JSON for handle 16-shadow-overflow, read
      2026-11-12) [mfr]
    - https://aquariumdepot.ca/products/synergy-reef-16-shadow-overflow-v3 [retailer, via search index; page later
      404/429]
    - https://coastalpets.co.za/products/synergy-reef-16-shadow-overflow [retailer, via search index]
    notes: 'Rated flow, 1.6 in internal box thickness, three 1.5 in bulkheads and 63 mm hole are from the mfr''s
      own product text. Box/external-box W x D x H (16 x 1.6 x 5.5; 16 x 3.75 x 7 in) are from retailer listings
      (same figures on several retailers); mfr page text read did not list them. Retailer tank-thickness range:
      1/4 to 3/4 in glass or acrylic. A Reef2Reef user calls 1500 GPH the practical ''sweet spot'' [forum]. Some
      retailers still list ''up to 1500 GPH'' (older Shadow figure). Synergy''s product tags include ''Ghost Overflow''.
      V2 (2021, ''new sealed rear lid and rear box'') is superseded by V3; no separate V2 spec captured.'
