# ReefFlow light-fixture catalogue (D-844). Real products, checked 2026-11-12.
#
# Same fields as the generic archetypes in fixture_library.yaml, plus brand, model, sources
# and the basis of each modelled number. No maker publishes total photon output (PPF), so
# every `ppf` here is DERIVED (see ppf_basis):
#   * fitted to published PAR readings with the ReefFlow emitter model where readings exist
#     (Reef Builders in-air grids; DaniReef in-air readings; Red Sea's own surface figures);
#   * same-family fixtures use the fitted sibling's efficacy (umol/J);
#   * otherwise power x 1.41 umol/J, the mean of the three independently fitted fixtures.
# Footprints are housing sizes. Uncalibrated light results stay labelled "estimated";
# a PAR-meter calibration (lighting.calibration) replaces these numbers.
# Regenerate with the research scripts; do not hand-edit numbers without updating ppf_basis.
ecotech_radion_xr30_g6_pro:
  brand: EcoTech Marine
  model: Radion XR30 G6 Pro
  type: led_panel
  description: EcoTech Marine Radion XR30 G6 Pro
  footprint:
    length: 300 mm
    width: 180 mm
  emitters:
    nx: 1
    ny: 1
    size:
    - 300 mm
    - 180 mm
  distribution:
    type: beam_angle
    beam_angle: 125 deg
  beam_basis: 'EcoTech: standard optic 124-126 deg'
  power: 215 W
  ppf: 246 umol/s
  ppf_basis: 'fitted to Reef Builders'' in-air PAR grid (24 and 30 in, 7 readings, 215.9 W measured) with the published
    125 deg beam: 1.14 umol/J, readings matched to 11 % rms (max 16 %)'
  channels:
    cool_white:
      share: 0.16
      spectrum: cool_white
    warm_white:
      share: 0.08
      spectrum: warm_white
    royal_blue:
      share: 0.32
      spectrum: royal_blue
    blue:
      share: 0.16
      spectrum: blue
    indigo:
      share: 0.08
      spectrum: indigo
    violet:
      share: 0.1
      spectrum: violet
    green:
      share: 0.06
      spectrum: green
    red:
      share: 0.04
      spectrum: red
  par_data:
  - par: 173.2
    depth: n/a (in air)
    mount_height: 24 in fixture-to-sensor
    position: peak
    settings: not stated (measured 215.9 W = full power)
    source: Reef Builders 2024 independent test https://reefbuilders.com/2024/10/01/radion-g6-gnc-bluray-x-and-ai-blade-coral-grow-led-light-test
  - par: 111.7
    depth: n/a (in air)
    mount_height: 30 in fixture-to-sensor
    position: peak
    settings: as above
    source: Reef Builders 2024
  - par: 124.9
    depth: n/a (in air)
    mount_height: 24 in fixture-to-sensor
    position: average, 3x3 ft grid (169 pts, 3 in spacing)
    settings: as above
    source: Reef Builders 2024
  - par: 92.4
    depth: n/a (in air)
    mount_height: 30 in fixture-to-sensor
    position: average, 3x3 ft grid
    settings: as above
    source: Reef Builders 2024
  - par: 150.9
    depth: n/a (in air)
    mount_height: 24 in fixture-to-sensor
    position: average, central 2x2 ft (81 pts)
    settings: as above
    source: Reef Builders 2024
  - par: 103.0
    depth: n/a (in air)
    mount_height: 30 in fixture-to-sensor
    position: average, central 2x2 ft (81 pts)
    settings: as above
    source: Reef Builders 2024
  - par: 172.0
    depth: n/a (in air)
    mount_height: 23.25 in fixture-to-sensor
    position: centre single point
    settings: as above
    source: Reef Builders 2024
  status: current
  checked: '2026-11-12'
  sources:
  - https://ecotechmarine.com/radion
  - https://ecotechmarine.com/wp-content/uploads/2023/12/High-Intensity-Lens-Kit-Narrow-Angle-Optic_web.pdf
  - https://reefbuilders.com/2024/10/01/radion-g6-gnc-bluray-x-and-ai-blade-coral-grow-led-light-test
  notes: 'Footprint is the housing size (no maker publishes the emitting area). Channel shares follow the LED counts
    per colour (all LEDs assumed equal output). '
  research_notes: '101 LEDs. Good validation case: Reef Builders grid at 24/30 in, LI-COR LI-192SA, fixture long
    axis along Y. Derived (compiler): 3x3 ft grid total 21115.4 x (0.0762 m)^2 = ~122.6 umol/s intercepted within
    3x3 ft at 24 in -> lower bound on PPF, ~0.57 umol/J of wall power intercepted. Not a published PPF.'
