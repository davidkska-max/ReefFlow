# ReefFlow light-fixture reference data
# Compiled 2026-11-12. Values are as published by the cited source; null = not published / not found.
# Conventions:
#   par        = PPFD in umol/m2/s
#   depth      = depth below the water surface; "n/a (in air)" for open-air bench tests
#   mount_height = fixture face to water surface (or, for in-air tests, fixture-to-sensor distance, stated as such)
#   footprint  = housing dimensions unless an emitting-area figure is published (none of these makers publish one)
#   "derived" in notes = arithmetic done by the compiler from published numbers, NOT a published value.
# No manufacturer in this list publishes total PPF (umol/s) or efficacy (umol/J) for these fixtures.

