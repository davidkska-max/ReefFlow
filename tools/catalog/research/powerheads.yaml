# ReefFlow equipment catalogue: aquarium powerheads / circulation pumps
# Compiled 2026-11-12. Values are as published, with units as published. Nothing is guessed.
# outlet_basis values:
#   "manufacturer"            the outlet diameter is printed in the maker's manual or product page
#   "retailer-published"      a retailer lists an outlet diameter but the maker's page could not be reached
#   "derived (upper bound)"   taken from the published wet-side or body envelope. The real opening is
#                             the same size or smaller (grille, nozzle lip, end caps).
#   "derived (drawing)"       scaled from the maker's dimensioned drawing (about +/-3 mm)
#   "not published"           outlet is null
# Cross-flow (gyre) slot sizes are always upper bounds. No maker publishes the slot length or height.
# The width is the overall body length (it includes the motor end and end caps). The height is the
# smallest body cross-section dimension (the impeller cage has to fit inside it).

