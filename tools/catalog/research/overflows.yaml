# ReefFlow overflow catalogue + generic drain capacity references
# Compiled 2026-11-12. Values are as published; null = not published / not found.
#
# Box convention (ReefFlow): width = along the glass, depth = out from the glass,
# height = vertical. For internal/through-glass overflows `box` is the IN-TANK
# (display-side) box and `external_box` is the rear plumbing box behind the glass.
# For hang-on-back units `box` is the overall published size; the in-tank part is
# smaller and is not separately published unless noted.
#
# Confidence flags used in notes:
#   [mfr]       read on the manufacturer's own page / manual / PDF
#   [retailer]  read on a retailer listing (usually copies the mfr table)
#   [indexed]   mfr page is offline/password-gated; value taken from a search-engine
#               index snippet of that mfr page, not read directly
#   [forum]     hobbyist forum / used listing; low confidence
#
# Weir crest depth below the water surface is NOT published for any product below
# (Reef Savvy and Modular Marine give only qualitative/related statements, noted).

