# Not catalogued (no published overflow-box dimensions or overflow flow rating found):
#  - Waterbox (Reef / Infinia / Peninsula / Marine X): spec page publishes drain sizes
#    only, e.g. INFINIA REEF main drain DN32 + emergency DN32 + return DN25; REEF LX
#    main 2 x DN25 + emergency DN32. https://www.waterboxaquariums.com/specs/marine/
#  - Innovative Marine NUVO: INT tanks have 3 x 1 in pre-drilled BeanAnimal holes and a
#    3/4 in return; EXT tanks 1 in drains. Only "recommended return flow" ranges are
#    published (e.g. INT 75: 1000-2000 GPH; INT 170: 1700-3400 GPH, per retailer
#    listings), not overflow capacity or box dims.
#  - Synergy "coast-to-coast" / "Pinnacle" overflow: no such Synergy Reef product found;
#    Synergy's current overflow line is the 16 in Shadow V3 only.

drain_capacity:
  # Per-pipe flow references. "siphon" = full (air-free) siphon; "gravity" = vented /
  # Durso / open-channel. Pipe size = nominal bulkhead/pipe size. null = source gives
  # no figure. Siphon capacity depends strongly on vertical drop and fittings; none of
  # these sources state a drop except Aquaculator (4 ft).

  # --- Source 1: WetWebMedia, Scott Vallembois, "Flow rates of various bulkheads"
  #     (measured: timed 50 gal through each bulkhead; water held just above the
  #     bulkhead top; Durso-style standpipe straight down to sump).
  - pipe: "3/4 in"
    siphon: "489 GPH (measured, siphon for entire trial)"
    gravity: "165 GPH (measured)"
    source: "WetWebMedia - Scott Vallembois, bulkhead flow-rate test, http://wetwebmedia.com/BulkheadFloRateArt.htm"
    notes: "Single measured runs. Author recommends running 'considerably less' than these figures."
  - pipe: "1 in"
    siphon: "957 GPH (measured, siphon for entire trial)"
    gravity: "350 GPH (measured; ~320 with 5 ft horizontal run; ~160 with run + intake strainer)"
    source: "WetWebMedia - Scott Vallembois, http://wetwebmedia.com/BulkheadFloRateArt.htm"
    notes: "Megaflow 1 in bulkhead with ~4 in water above the Durso inlet measured 379 GPH."
  - pipe: "1.25 in"
    siphon: null
    gravity: null
    source: "WetWebMedia - Scott Vallembois (size not tested)"
    notes: null
  - pipe: "1.5 in"
    siphon: null
    gravity: "975 GPH (measured; ~835 with 5 ft horizontal run; ~715 with run + strainer)"
    source: "WetWebMedia - Scott Vallembois, http://wetwebmedia.com/BulkheadFloRateArt.htm"
    notes: "No siphon run reported for 1.5 in."
  - pipe: "2 in"
    siphon: "1475 GPH (partial siphon during trial; not a full-siphon figure)"
    gravity: "1350 GPH (measured; ~1270 with 5 ft run; ~1050 with run + strainer)"
    source: "WetWebMedia - Scott Vallembois, http://wetwebmedia.com/BulkheadFloRateArt.htm"
    notes: "Article conclusion: flow 'can more than double if a siphon effect occurs'."

  # --- Source 2: Durso Standpipes FAQ (Richard Durso), per bulkhead with Durso standpipe
  - pipe: "3/4 in"
    siphon: null
    gravity: "~350 GPH (marked unconfirmed by the source)"
    source: "Durso Standpipes FAQ 'What flow rates are possible with a Durso Standpipe?', https://www.dursostandpipes.com/frequently-asked-questions/flow-rates/"
    notes: null
  - pipe: "1 in"
    siphon: null
    gravity: "~600 GPH"
    source: "Durso Standpipes FAQ, https://www.dursostandpipes.com/frequently-asked-questions/flow-rates/"
    notes: "FAQ says users have reached 800-1000 GPH through 1 in by changing teeth spacing/vent hole (not recommended). Durso's 1 in standpipe is built from 1.25 in pipe."
  - pipe: "1.5 in"
    siphon: null
    gravity: "~1500 GPH"
    source: "Durso Standpipes FAQ, https://www.dursostandpipes.com/frequently-asked-questions/flow-rates/"
    notes: "FAQ says the overflow teeth spacing and the bulkhead, not the standpipe, usually limit flow."

  # --- Source 3: Simplicity Aquatics rule-of-thumb table (bulkhead size vs max flow)
  - pipe: "3/4 in"
    siphon: null
    gravity: "up to 325 GPH"
    source: "Simplicity Aquatics, 'How to Choose the Right Size Return Pump', https://www.simplicityaquatics.com/blog/how-to-choose-the-right-size-pump-for-my-aquarium/"
    notes: "Table is not labelled gravity, but the page adds 'flow rate through a siphon drain will generally be significantly higher than a gravity drain', implying gravity. Recommends >= 5 in linear weir."
  - pipe: "1 in"
    siphon: null
    gravity: "up to 600 GPH"
    source: "Simplicity Aquatics (as above)"
    notes: "Recommends >= 9 in linear weir. Also lists 1/2 in: up to 150 GPH, >= 2 in weir."
  - pipe: "1.5 in"
    siphon: null
    gravity: "up to 1300 GPH"
    source: "Simplicity Aquatics (as above)"
    notes: "Recommends >= 20 in linear weir. A Reef Central forum chart quotes the same series (1 in 590, 1.5 in 1300, 2 in 2300) - likely a common origin."
  - pipe: "2 in"
    siphon: null
    gravity: "up to 2300 GPH"
    source: "Simplicity Aquatics (as above)"
    notes: "Recommends >= 35 in linear weir."

  # --- Source 4: BeanAnimal original write-up (system-level, not per pipe)
  - pipe: "1 in bulkheads with 1.5 in standpipes/drains (x3: siphon + open channel + emergency)"
    siphon: "system total 2000 GPH 'silently ... with plenty of headroom', emergency dry"
    gravity: null
    source: "BeanAnimal, 'Silent & Fail-Safe Aquarium Overflow System' (2008), https://beananimal.com/projects/silent-and-fail-safe-aquarium-overflow-system/"
    notes: "Author's own tank (running since Nov 2005). Split between siphon and open-channel pipes not given; no drop height given. States a full siphon handles 'MUCH MORE' than an air-mixed drain and that larger bulkheads are suitable. No per-size table in the write-up."

  # --- Source 5: Aquaculator calculator page (unattributed web calculator - low weight)
  - pipe: "3/4 in"
    siphon: "~800 GPH"
    gravity: "~220 GPH"
    source: "Aquaculator overflow pipe-size calculator, https://aquaculator.com/aquarium-overflow-pipe-size-calculator/"
    notes: "Schedule 40; siphon at an assumed 4 ft drop; 'Torricelli' basis, no formula or author published; area column uses nominal size as ID. Use only as a cross-check."
  - pipe: "1 in"
    siphon: "~1500 GPH"
    gravity: "~350 GPH"
    source: "Aquaculator (as above)"
    notes: "Gravity figure matches WWM measurement; siphon higher than WWM's measured 957 (different/unknown drop)."
  - pipe: "1.25 in"
    siphon: "~2400 GPH"
    gravity: "~600 GPH"
    source: "Aquaculator (as above)"
    notes: "Only source found with a 1.25 in figure."
  - pipe: "1.5 in"
    siphon: "~3200 GPH"
    gravity: "~950 GPH"
    source: "Aquaculator (as above)"
    notes: null
  - pipe: "2 in"
    siphon: null
    gravity: null
    source: "Aquaculator (size not listed)"
    notes: null

  # --- Checked, no numbers: Bulk Reef Supply / Marine Depot "Overflow Boxes and Drain
  #     Styles - Durso, Herbie, and BeanAnimal" (R. Farnsworth, updated 2024-03-28)
  #     gives only qualitative comparisons. Glass-Holes.com and Synergy drain tables:
  #     Glass-Holes site is gone; Synergy's overflow guide pages publish no per-pipe
  #     capacity (they say capacity depends on pipe size, fittings and drop).
