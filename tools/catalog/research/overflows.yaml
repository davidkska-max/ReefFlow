  # ---------------------------------------------------------------- Red Sea Reefer (built-in)
  # Red Sea does not publish overflow-box dimensions or drain pipe sizes in the G2/G2+
  # manuals. The G2 manual publishes a 'Recommended flow rate for return pumps' table
  # and warns: "The use of higher rated pumps will result in a higher water level in
  # the aquarium unless an appropriate modification is made to the surface skimmer
  # combs." The G2+ manual replaces the table with pump models (ReefRun 5500 =
  # 2000-5500 l/h; ReefRun 7000 = 3000-7000 l/h). G3/G3+: no per-model overflow or
  # flow figures found (Red Sea only claims 'up to 50% more water circulation').
  # All Reefers use the same drain design: flow-regulated main downpipe (fine
