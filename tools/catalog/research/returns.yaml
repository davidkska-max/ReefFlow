# ReefFlow equipment library - aquarium RETURN pumps (sump -> display)
# Compiled 2026-11-12. Values are as published (units as published). null = not published / not found.
# curve: list of [head, flow] pairs. curve_basis says where the points came from.
#   "manufacturer table"            - numbers printed by the manufacturer
#   "read from manufacturer chart"  - digitised by pixel/vector extraction from a manufacturer chart image/PDF;
#                                     typical reading error is noted per entry.
# Extra keys used on a few entries: curve_alt / curve_alt_basis (a second, conflicting manufacturer source).
# Model check note: the simulator's Q = Q0*sqrt(1 - H/H0) is concave in Q(H). Several manufacturers publish
# charts that are straight lines (Tunze, Eheim, Red Sea G2) or near-linear tables (Sicce catalog, Danner);
# those are schematic, not measured curves, so treat them as weaker evidence than the digitised curves.

