ecotech_mp10wqd:
  kind: powerhead
  brand: EcoTech Marine
  model: VorTech MP10wQD
  pump_type: propeller
  description: EcoTech Marine VorTech MP10wQD (propeller powerhead)
  rated_flow: 1500 GPH
  rated_flow_basis: 'EcoTech: ''1,500+ gph''; delivered flow = rated x derating 0.7 (A-205)'
  outlet:
    shape: circle
    diameter: 39 mm
  outlet_basis: 'not published: sized so the jet leaves at 1.34 m/s at rated flow, the median of the 12 pumps with
    a published or measured outlet (below the wet-side size 64 mm)'
  power: 18 W
  dimensions: Wet side 2.5 in dia x 1.5 in long (63.5 x 38.1 mm); dry side 2.5 in dia x 2 in long (63.5 x 50.8 mm);
    clearance behind tank 2.25 in (57 mm)
  tank_range: 2.5-50+ gal (9.5-190 L)
  modes: 'Controllable (QuietDrive driver, wireless ''w''): constant, Lagoon, Reef Crest, Short Pulse, Gyre, Tidal
    Swell, Nutrient Transport, Feed, Night, Wave Auto-Tune; EcoSmart Live / ReefLink'
  status: discontinued
  checked: '2026-11-12'
  sources:
  - https://www.marine-aquatics.eu/inshop/files/ecotech-marine/VorTech_QD_QUIETDRIVE_Datasheet_info-en.pdf
  - https://support.ecotechmarine.com/hc/en-us/article_attachments/4402323654935
  - https://ecotechmarine.com/vortech
  notes: Flow, power and tank range come from EcoTech's QuietDrive launch datasheet (8-18 W). Dimensions come from
    the EcoTech EcoSmart manual (rev 1.1) on support.ecotechmarine.com. Per the datasheet, the MP10QD keeps the
    ES motor and wet side and only the driver changed. Max glass 0.375 in (9.5 mm). Status is discontinued because
    ecotechmarine.com/vortech now lists only the MP10mQD.
ecotech_mp40wqd:
  kind: powerhead
  brand: EcoTech Marine
  model: VorTech MP40wQD
  pump_type: propeller
  description: EcoTech Marine VorTech MP40wQD (propeller powerhead)
  rated_flow: 4500 GPH
  rated_flow_basis: 'EcoTech: ''4,500+ gph''; delivered flow = rated x derating 0.7 (A-205)'
  outlet:
    shape: circle
    diameter: 67 mm
  outlet_basis: 'not published: sized so the jet leaves at 1.34 m/s at rated flow, the median of the 12 pumps with
    a published or measured outlet (below the wet-side size 76 mm)'
  power: 38 W
  dimensions: 'Wet side 3 in (76 mm) diameter. The QD datasheet drawing shows 3 in, 3 in, 2.25 in (57 mm) and 3
    in for wet/dry side, and retailers list the wet side as 3 x 3 in. Older MP40wES: wet and dry side both 3 in
    dia x 2.25 in long.'
  tank_range: 50-500+ gal (190-1,800 L)
  modes: 'Controllable: constant, Lagoon, Reef Crest, Short Pulse, Gyre, Tidal Swell, Nutrient Transport, Feed,
    Night, Wave Auto-Tune; wireless sync/anti-sync; ReefLink/EcoSmart Live'
  status: discontinued
  checked: '2026-11-12'
  sources:
  - https://www.marine-aquatics.eu/inshop/files/ecotech-marine/VorTech_QD_QUIETDRIVE_Datasheet_info-en.pdf
  - https://support.ecotechmarine.com/hc/en-us/article_attachments/4402323654935
  - https://www.bulkreefsupply.com/vortech-mp40w-qd-propeller-pump-ecotech-marine.html
  notes: Power 9-38 W per the EcoTech datasheet. Retailers list a measured max of about 47 W in Gyre mode, which
    is unverified. Unlike the MP10 and MP60, the MP40wQD has a completely new wet side, dry side, motor, PSU and
    driver compared with the MP40wES. The datasheet says '40% more output' than the MP40wES, which was rated 1,000-3,200
    gph and 9-28 W. Wet-side LENGTH is uncertain (2.25 in or 3 in). The diameter (3 in) is consistent across sources.
    Max glass 0.75 in (19 mm). Superseded by the MP40mQD and listed as retired by retailers.
